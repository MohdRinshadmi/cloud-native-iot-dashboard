global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: iot-dashboard

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Go + Gin API exposes Prometheus metrics at /metrics (wired in Phase 10).
  - job_name: iot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api
