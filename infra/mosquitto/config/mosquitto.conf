# Mosquitto broker — development configuration
# NOTE: anonymous access is enabled for local dev ONLY. Phase 5 adds
# username/password + ACLs; production uses mTLS via AWS IoT Core.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# Plain MQTT
listener 1883
allow_anonymous true

# MQTT over WebSockets (lets the browser subscribe directly if needed)
listener 9001
protocol websockets
allow_anonymous true
